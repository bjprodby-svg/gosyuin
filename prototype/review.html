<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype Review - 御朱印マップ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header */
  .review-header {
    width: 100%;
    max-width: 900px;
    padding: 32px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .review-title {
    font-size: 20px;
    font-weight: 700;
  }
  .review-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(255,180,0,0.15);
    color: #FFB400;
  }

  /* Main layout */
  .review-body {
    width: 100%;
    max-width: 900px;
    padding: 0 24px;
    display: flex;
    gap: 24px;
    flex: 1;
  }

  /* iPhone Frame */
  .phone-wrapper {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .phone-frame {
    width: 375px;
    height: 812px;
    border-radius: 48px;
    border: 6px solid #333;
    background: #000;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 2px #555;
  }
  .phone-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 42px;
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 28px;
    background: #000;
    border-radius: 0 0 18px 18px;
    z-index: 10;
  }
  .screen-label {
    font-size: 13px;
    color: #888;
  }

  /* Sidebar */
  .review-sidebar {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }

  /* Info card */
  .info-card {
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .info-card h3 {
    font-size: 14px;
    font-weight: 700;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
  }
  .info-row:last-child { border: none; }
  .info-label { color: #888; }
  .info-value { font-weight: 600; }

  /* Screen list */
  .screen-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .screen-item {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .screen-item:hover { background: rgba(255,255,255,0.06); }
  .screen-item.active {
    background: rgba(209,75,47,0.15);
    color: #FF7B5C;
  }
  .screen-dot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
    background: #444;
  }
  .screen-item.active .screen-dot { background: #FF7B5C; }

  /* Feedback */
  .feedback-area {
    width: 100%;
    min-height: 80px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .feedback-area::placeholder { color: #555; }
  .feedback-area:focus {
    outline: none;
    border-color: rgba(209,75,47,0.5);
  }

  /* Action buttons */
  .review-actions {
    width: 100%;
    max-width: 900px;
    padding: 16px 24px 32px;
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-approve {
    background: #2ECC71;
    color: #fff;
  }
  .btn-approve:hover { background: #27AE60; }
  .btn-revise {
    background: rgba(255,180,0,0.15);
    color: #FFB400;
  }
  .btn-revise:hover { background: rgba(255,180,0,0.25); }
  .btn-reject {
    background: rgba(255,255,255,0.06);
    color: #888;
  }
  .btn-reject:hover { background: rgba(255,255,255,0.1); }

  /* Toast */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.3s ease;
    z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #2ECC71; color: white; }
  .toast.warning { background: #FFB400; color: #1a1a2e; }

  /* Responsive */
  @media (max-width: 860px) {
    .review-body { flex-direction: column; align-items: center; }
    .phone-frame { width: 320px; height: 693px; }
    .review-sidebar { width: 100%; }
  }
</style>
</head>
<body>

<div class="review-header">
  <div class="review-title">Prototype Review</div>
  <div class="review-badge">REVIEW PENDING</div>
</div>

<div class="review-body">
  <!-- iPhone Preview -->
  <div class="phone-wrapper">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <iframe id="prototypeFrame" src="index.html"></iframe>
    </div>
    <div class="screen-label" id="currentScreen">地図表示（Explore）</div>
  </div>

  <!-- Sidebar -->
  <div class="review-sidebar">
    <!-- Project info -->
    <div class="info-card">
      <h3>Project Info</h3>
      <div class="info-row">
        <span class="info-label">App</span>
        <span class="info-value">御朱印マップ</span>
      </div>
      <div class="info-row">
        <span class="info-label">Feature</span>
        <span class="info-value">地図表示機能</span>
      </div>
      <div class="info-row">
        <span class="info-label">Platform</span>
        <span class="info-value">iOS (SwiftUI)</span>
      </div>
      <div class="info-row">
        <span class="info-label">Status</span>
        <span class="info-value" style="color: #FFB400;">Prototype</span>
      </div>
    </div>

    <!-- Screens -->
    <div class="info-card">
      <h3>Screens</h3>
      <div class="screen-list">
        <div class="screen-item active" onclick="switchScreen('index.html', this, '地図表示（Explore）')">
          <div class="screen-dot"></div>
          地図表示（メイン）
        </div>
        <div class="screen-item" onclick="switchScreen('index.html#detail', this, '神社詳細シート')">
          <div class="screen-dot"></div>
          神社詳細シート
        </div>
      </div>
    </div>

    <!-- Checklist -->
    <div class="info-card">
      <h3>Check Points</h3>
      <label style="display:flex;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;">
        <input type="checkbox"> レイアウト・配置は適切か
      </label>
      <label style="display:flex;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;">
        <input type="checkbox"> 配色・トーンがアプリに合っているか
      </label>
      <label style="display:flex;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;">
        <input type="checkbox"> インタラクション（タップ時の挙動）
      </label>
      <label style="display:flex;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;">
        <input type="checkbox"> 情報の過不足
      </label>
    </div>

    <!-- Feedback -->
    <div class="info-card">
      <h3>Feedback</h3>
      <textarea class="feedback-area" id="feedbackText" placeholder="修正点やコメントを入力..."></textarea>
    </div>
  </div>
</div>

<!-- Action buttons -->
<div class="review-actions">
  <button class="btn btn-reject" onclick="sendDecision('reject')">却下</button>
  <button class="btn btn-revise" onclick="sendDecision('revise')">修正依頼</button>
  <button class="btn btn-approve" onclick="sendDecision('approve')">承認 → SwiftUI に変換</button>
</div>

<div class="toast" id="toast"></div>

<script>
  function switchScreen(url, el, label) {
    document.getElementById('prototypeFrame').src = url;
    document.getElementById('currentScreen').textContent = label;
    document.querySelectorAll('.screen-item').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  function sendDecision(type) {
    const feedback = document.getElementById('feedbackText').value;
    const toast = document.getElementById('toast');
    const badge = document.querySelector('.review-badge');

    if (type === 'approve') {
      toast.textContent = '承認しました。Claude Code に戻って「OK」と伝えてください。';
      toast.className = 'toast success show';
      badge.textContent = 'APPROVED';
      badge.style.background = 'rgba(46,204,113,0.15)';
      badge.style.color = '#2ECC71';
    } else if (type === 'revise') {
      if (!feedback.trim()) {
        toast.textContent = 'フィードバック欄に修正内容を入力してください';
        toast.className = 'toast warning show';
        setTimeout(() => toast.classList.remove('show'), 3000);
        return;
      }
      toast.textContent = 'Claude Code に戻ってフィードバックを伝えてください：' + feedback;
      toast.className = 'toast warning show';
      badge.textContent = 'REVISION REQUESTED';
      badge.style.background = 'rgba(255,180,0,0.15)';
      badge.style.color = '#FFB400';
    } else {
      toast.textContent = '却下しました。Claude Code に戻って方向性を相談してください。';
      toast.className = 'toast warning show';
      badge.textContent = 'REJECTED';
      badge.style.background = 'rgba(255,75,75,0.15)';
      badge.style.color = '#FF4B4B';
    }

    setTimeout(() => toast.classList.remove('show'), 5000);
  }
</script>
</body>
</html>
